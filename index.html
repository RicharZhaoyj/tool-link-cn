<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link.cn - AI Tool Navigation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #fff; }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            border-color: rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen">
    <nav class="p-6 border-b border-zinc-900 flex justify-between items-center">
        <div class="text-xl font-bold tracking-tighter">LINK<span class="text-blue-500">.CN</span></div>
        <div class="text-xs text-zinc-500 font-mono" id="sync-time">Syncing...</div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 py-12">
        <section class="mb-12 text-center">
            <h1 class="text-4xl font-extrabold mb-4 italic">LIFETIME DEALS</h1>
            <p class="text-zinc-400">甄选全球顶尖 AI 工具，一次性付费，终身使用。</p>
        </section>

        <div id="tool-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="animate-pulse text-zinc-700">Loading tools...</div>
        </div>
    </main>

    <script>
        async function loadDeals() {
            const grid = document.getElementById('tool-grid');
            const syncTimeText = document.getElementById('sync-time');
            
            try {
                // 加上时间戳防止浏览器缓存 tools.json
                const response = await fetch('./tools.json?v=' + Date.now());
                const data = await response.json();

                if (data && data.length > 0) {
                    grid.innerHTML = ''; // 清空加载提示
                    
                    data.forEach(item => {
                        // 处理系统状态项
                        if (item.id === "SYNC-INFO") {
                            syncTimeText.innerText = item.title;
                            return;
                        }

                        // 渲染工具卡片
                        const card = `
                            <div class="glass-card p-6 rounded-2xl flex flex-col justify-between">
                                <div>
                                    <div class="flex justify-between items-start mb-4">
                                        <span class="px-2 py-1 bg-blue-500/10 text-blue-400 text-[10px] font-bold rounded uppercase tracking-wider">${item.tag}</span>
                                    </div>
                                    <h2 class="text-xl font-bold mb-2 leading-tight">${item.title}</h2>
                                    <p class="text-zinc-400 text-sm mb-6 line-clamp-3">${item.desc}</p>
                                </div>
                                <a href="${item.url}" target="_blank" rel="nofollow" 
                                   class="block w-full py-3 text-center bg-white text-black text-sm font-bold rounded-xl hover:bg-blue-500 hover:text-white transition-colors">
                                    VIEW DEAL →
                                </a>
                            </div>
                        `;
                        grid.innerHTML += card;
                    });
                }
            } catch (err) {
                grid.innerHTML = '<div class="text-red-500">加载失败，请刷新页面。</div>';
                console.error(err);
            }
        }

        window.onload = loadDeals;
    </script>
</body>
</html>
