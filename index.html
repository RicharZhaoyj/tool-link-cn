<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINK.CN | AI 导航</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #fff; font-family: sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }
        .glass-card:hover { transform: translateY(-5px); border-color: #3b82f6; }
    </style>
</head>
<body>
    <nav class="p-6 border-b border-white/5 flex justify-between items-center">
        <div class="font-bold text-xl uppercase tracking-tighter">Link<span class="text-blue-500">.cn</span></div>
        <div id="sync-status" class="text-[10px] font-mono text-zinc-500">INIT...</div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 py-12">
        <div id="tool-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="text-zinc-600 animate-pulse">正在连接协议层...</div>
        </div>
    </main>

    <script>
        async function loadDeals() {
            const grid = document.getElementById('tool-grid');
            const status = document.getElementById('sync-status');
            
            try {
                // 【核心修复】强制不使用缓存，并追加动态时间戳
                const timestamp = new Date().getTime();
                const response = await fetch(`./tools.json?t=${timestamp}`, {
                    cache: "no-store" 
                });
                
                if (!response.ok) throw new Error('网络响应异常');
                const data = await response.json();

                if (data && data.length > 0) {
                    grid.innerHTML = '';
                    data.forEach(item => {
                        // 更新同步状态
                        if (item.id === "SYNC-INFO") {
                            status.innerText = item.title;
                            return;
                        }

                        // 渲染卡片
                        grid.innerHTML += `
                            <div class="glass-card p-6 rounded-2xl flex flex-col">
                                <div class="mb-4">
                                    <span class="text-[10px] bg-blue-500/20 text-blue-400 px-2 py-1 rounded uppercase font-bold">${item.tag}</span>
                                </div>
                                <h3 class="text-lg font-bold mb-2">${item.title}</h3>
                                <p class="text-zinc-400 text-xs mb-6 flex-grow">${item.desc}</p>
                                <a href="${item.url}" target="_blank" rel="nofollow" class="w-full py-3 bg-white text-black text-center text-sm font-bold rounded-xl hover:bg-blue-500 hover:text-white transition-colors">
                                    立即查看 →
                                </a>
                            </div>
                        `;
                    });
                }
            } catch (e) {
                grid.innerHTML = `<div class="text-red-500 text-sm font-mono">ERR: ${e.message}</div>`;
                status.innerText = "OFFLINE";
            }
        }
        window.addEventListener('DOMContentLoaded', loadDeals);
    </script>
</body>
