<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool.Link.cn | AI 自动化工具导航</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: #d4d4d4; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.3s ease; }
        .glass-card:hover { border-color: #3b82f6; background: rgba(59, 130, 246, 0.05); transform: translateY(-2px); }
        .neon-text { text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <div class="max-w-5xl mx-auto px-6 py-12 flex-grow">
        <header class="flex justify-between items-center mb-16 border-b border-zinc-800 pb-8">
            <div>
                <h1 class="text-2xl font-black tracking-tighter text-white neon-text uppercase">Tool.Link.cn</h1>
                <p class="text-zinc-500 text-sm mt-1 uppercase tracking-widest">AI Agent Directory • 24H Automated</p>
            </div>
            <nav class="text-xs font-mono space-x-4">
                <a href="https://link.cn" class="hover:text-blue-400">LINK.CN MAIN</a>
                <span class="text-zinc-700">|</span>
                <span id="status-dot" class="text-green-500">● SYSTEM ONLINE</span>
            </nav>
        </header>

        <div id="tool-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="glass-card p-6 rounded-xl flex items-center justify-center border-dashed border-zinc-700">
                <p class="text-zinc-600 text-sm italic tracking-widest uppercase animate-pulse">Loading Tools...</p>
            </div>
        </div>

        <footer class="mt-24 pt-8 border-t border-zinc-900 text-center text-[10px] text-zinc-600 tracking-widest uppercase">
            &copy; 2026 LINK.CN • PART OF THE LINK PROTOCOL ECOSYSTEM
        </footer>
    </div>

    <script>
        async function loadTools() {
            try {
                // 1. 获取最新的 tools.json (加上时间戳防止缓存)
                const response = await fetch('./tools.json?t=' + new Date().getTime());
                const tools = await response.json();
                const grid = document.getElementById('tool-grid');
                
                // 2. 清空加载状态
                grid.innerHTML = '';

                // 3. 循环渲染卡片
                tools.forEach(tool => {
                    const card = `
                        <div class="glass-card p-6 rounded-xl group">
                            <div class="flex justify-between items-start mb-4">
                                <span class="px-2 py-1 bg-blue-900/30 text-blue-400 text-[10px] font-bold rounded uppercase">${tool.tag}</span>
                                <span class="text-zinc-600 text-[10px] font-mono">ID: ${tool.id}</span>
                            </div>
                            <h2 class="text-lg font-bold text-white mb-2 group-hover:text-blue-400 transition-colors">${tool.title}</h2>
                            <p class="text-sm text-zinc-400 leading-relaxed mb-4">${tool.desc}</p>
                            <a href="${tool.url}" target="_blank" class="text-xs font-bold text-white border-b border-white pb-1 hover:text-blue-400 hover:border-blue-400 transition-all">VIEW PROJECT →</a>
                        </div>
                    `;
                    grid.innerHTML += card;
                });
            } catch (error) {
                console.error('Error loading tools:', error);
            }
        }
        // 页面加载完毕后执行
        window.onload = loadTools;
    </script>
</body>
</html>
