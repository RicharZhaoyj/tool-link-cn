name: 24H Auto Curator
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Script
        run: python -u update.py

      - name: Commit and Push
        run: |
          git config --local user.email "bot@link.cn"
          git config --local user.name "Link-Bot"
          
          # 强制拉取最新代码，防止推送冲突
          git pull origin main --rebase
          
          git add tools.json
          
          # 只有在有变动时才提交
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-sync tools.json [$(date)]"
            git push origin main
          else
            echo "No changes to commit."
          fi
