name: 24H Auto Curator
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 【关键点 1】显式声明权限范围
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 【关键点 2】显式使用内置令牌
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Script
        run: python -u update.py

      - name: Commit and Push
        run: |
          git config --local user.email "bot@link.cn"
          git config --local user.name "Link-Bot"
          
          # 确保在推送前拉取最新远程变更，避免冲突
          git pull origin main --rebase
          
          git add tools.json
          
          # 检查是否有文件变更
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-sync tools.json [$(date)]"
            # 使用包含权限的 URL 进行推送
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" main
          else
            echo "No changes to commit."
          fi
