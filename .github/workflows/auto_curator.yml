name: 24H Auto Curator
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # 消除 Node 20 警告

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Script
        # 使用 -u 参数强制显示 Python 实时日志，方便排错
        run: python -u update.py

      - name: Verify and Push
        run: |
          git config --local user.email "bot@link.cn"
          git config --local user.name "Link-Bot"
          
          # 检查文件是否存在
          if [ ! -f "tools.json" ]; then
            echo "错误：tools.json 未生成！"
            exit 1
          fi
          
          git add tools.json
          # 强制提交，哪怕只有时间戳变化
          git commit -m "Auto-sync tools.json [$(date)]" || exit 0
          git push origin main
