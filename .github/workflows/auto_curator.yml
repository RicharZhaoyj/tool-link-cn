name: 24H Auto Curator
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Prepare Git
        run: |
          git config --local user.email "bot@link.cn"
          git config --local user.name "Link-Bot"
          git pull origin main --rebase || echo "No remote changes to pull"

      - name: Run Script
        env:
          IMPACT_SID: ${{ secrets.IMPACT_SID }}
          IMPACT_TOKEN: ${{ secrets.IMPACT_TOKEN }}
        run: python -u update.py

      - name: Update Sitemap
        run: |
          python -c "
          import json
          from datetime import datetime
          tools = json.load(open('tools.json'))
          urls = ['  <url>\n    <loc>https://tool.link.cn/</loc>\n    <changefreq>daily</changefreq>\n    <priority>1.0</priority>\n  </url>']
          for t in tools:
              if t.get('id') not in ('SYNC-INFO', 'STATUS', 'API-PENDING'):
                  urls.append(f'  <url>\n    <loc>https://tool.link.cn/#tool-{t[\"id\"]}</loc>\n    <changefreq>weekly</changefreq>\n    <priority>0.8</priority>\n  </url>')
          sitemap = '<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">\n' + '\n'.join(urls) + '\n</urlset>'
          open('sitemap.xml', 'w').write(sitemap)
          print(f'Sitemap updated with {len(urls)} URLs')
          "

      - name: Commit and Push
        run: |
          git add tools.json sitemap.xml
          
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-sync: tools.json + sitemap [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" main
          else
            echo "No changes to commit."
          fi
