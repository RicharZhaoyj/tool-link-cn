name: 24H Auto Curator
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      # --- 关键改动：先对齐远程分支，再运行脚本 ---
      - name: Prepare Git
        run: |
          git config --local user.email "bot@link.cn"
          git config --local user.name "Link-Bot"
          git pull origin main --rebase || echo "No remote changes to pull"

      - name: Run Script
        env:
          IMPACT_SID: ${{ secrets.IMPACT_SID }}
          IMPACT_TOKEN: ${{ secrets.IMPACT_TOKEN }}
        run: python -u update.py

      - name: Commit and Push
        run: |
          git add tools.json
          
          # 只有在有变动时才提交
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-sync tools.json [$(date)]"
            # 使用 Token 强制推送
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" main
          else
            echo "No changes to commit."
          fi
