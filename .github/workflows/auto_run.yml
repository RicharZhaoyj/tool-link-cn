name: 24H Content Engine
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5 # 升级到 v5 消除 Node 警告
        with:
          python-version: '3.10'
          
      - name: Run Update Script
        run: python scripts/curator.py
        
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          git commit -m "Auto-update: Real project links" || exit 0
          git push" || exit 0
          git push
