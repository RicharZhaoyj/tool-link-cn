name: 24H Content Engine
on:
  schedule:
    - cron: '0 0 * * *' # 每天早上 8 点自动跑
  workflow_dispatch: # 允许你手动点一下运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Run Update Script
        run: python scripts/curator.py
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          git commit -m "Auto-update: New AI Tool found" || exit 0
          git push
