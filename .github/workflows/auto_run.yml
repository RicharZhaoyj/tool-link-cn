name: 24H Auto Curator
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ============ 关键修复步骤：安装 requests ============
      - name: Install dependencies
        run: |
          pip install requests
      # ===================================================

      - name: Run Curator Script
        run: python update.py

      - name: Commit and Push
        run: |
          git config --local user.email "bot@link.cn"
          git config --local user.name "Link-Bot"
          git add .
          git commit -m "Auto-update AppSumo Deals (ID: 7294907)" || exit 0
          git pushe preserving history" || exit 0
          git push
