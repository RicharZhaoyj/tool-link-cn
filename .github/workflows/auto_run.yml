name: 24H Auto Curator
on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # 解决你看到的警告

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 确保有写权限，防止无法提交
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史，防止合并冲突

      - name: Set up Python
        uses: actions/setup-python@v5 # 升级到 v5
        with:
          python-version: '3.11'

      - name: Run Curator Script
        run: python update.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Auto-curated: Added new tool while preserving history" || exit 0
          git push
