name: 24H Content Engine
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Run Update Script
        # 这里是关键：我们直接运行 scripts 文件夹下的脚本，
        # 但 Python 会把生成的 data.json 放在仓库根目录（因为 checkout 默认就在根目录）
        run: python scripts/curator.py
        
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 显式添加 data.json，确保它在根目录被发现
          git add data.json
          git commit -m "Auto-update: Fixing data path" || exit 0
          git push
