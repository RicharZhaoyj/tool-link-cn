name: 24H Auto Curator
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史以确保 push 成功

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Curator Script
        run: python update.py

      - name: Commit and Push
        run: |
          git config --local user.email "bot@link.cn"
          git config --local user.name "Link-Bot"
          git add tools.json
          # 如果没有文件变化，commit 会跳过而不会报错
          git commit -m "Auto-update AppSumo Deals (ID: 7294907)" || echo "No changes to commit"
          git push origin main
