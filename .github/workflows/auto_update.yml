name: 24H Auto Curator
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - - name: Run Curator Script
        run: |
          python update.py
          # 诊断：打印出 tools.json 的前 5 行，看看内容到底变没变
          head -n 5 tools.json

      - name: Commit and Push
        run: |
          git config --local user.email "bot@link.cn"
          git config --local user.name "Link-Bot"
          # 强制添加，不理会 .gitignore
          git add -f tools.json 
          # 打印 git 状态看看
          git status
          git commit -m "Force Update tools.json (ID: 7294907)" || echo "No changes to commit"
          git push origin main
