name: 24H Auto Curator
on:
  schedule:
    - cron: '0 */12 * * *' # 每12小时运行一次
  workflow_dispatch:      # 支持手动点击按钮触发
  push:
    branches: [ main ]     # 配置文件变动时也触发测试

jobs:
  build:
    runs-on: ubuntu-latest
    # 核心：必须显式声明写权限
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史，防止 push 失败

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Curator Script
        run: |
          # 执行脚本
          python update.py
          # 【诊断步骤】确认文件是否真的生成了
          echo "--- 检查目录文件列表 ---"
          ls -l
          echo "--- 检查 tools.json 内容预览 ---"
          head -n 10 tools.json || echo "tools.json 不存在！"

      - name: Commit and Push
        run: |
          git config --local user.email "bot@link.cn"
          git config --local user.name "Link-Bot"
          
          # 【核心修复】强制添加文件，防止被 .gitignore 意外拦截
          git add -f tools.json
          
          # 检查是否有内容需要提交，如果没有则打印提示而不报错
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-update AppSumo Deals (ID: 7294907) [$(date +'%Y-%m-%d %H:%M')]"
            git push origin main
          else
            echo "No changes detected in tools.json, skipping push."
          fi
