name: 24H Auto Curator
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Curator Script
        # 确保 update.py 就在仓库根目录下
        run: python update.py 

      - name: Commit and Push
        run: |
          git config --local user.email "bot@link.cn"
          git config --local user.name "Link-Bot"
          # 强制指定添加根目录下的 tools.json
          git add tools.json
          git commit -m "Auto-update AppSumo Deals (ID: 7294907)" || echo "No changes"
          git push origin main
